<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘뭐먹지</title>
<meta name="theme-color" content="#fff6ec">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff6ec; color: #3a2a1d; font-family: system-ui, sans-serif; }
  main { padding: 24px 16px; max-width: 480px; text-align: center; }
  p { font-size: 1.375rem; line-height: 1.5; margin: 0 0 24px; }
  a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 28px; border-radius: 22px; background: #e8590c; color: #fff; font-size: 1.125rem; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main id="notice" hidden>
  <p id="msg"></p>
  <a id="link" href="https://github.com/YangDongCheol/eat-in-korea/releases/latest"></a>
</main>
<script>
function decide(userAgent, language) {
  if (!/; wv\)/.test(userAgent)) return { action: "redirect" };
  const l = String(language).slice(0, 2).toLowerCase();
  return { action: "notice", lang: l === "ko" || l === "zh" ? l : "en" };
}
const TEXT = {
  ko: ["새 앱(오늘뭐먹지)이 나왔어요. 새 앱을 설치해 주세요.", "새 앱 받기"],
  en: ["A new app, 오늘뭐먹지, is out. Please install the new app.", "Get the new app"],
  zh: ["新应用 오늘뭐먹지 已上线，请安装新应用。", "获取新应用"],
};
const d = decide(navigator.userAgent, navigator.language);
if (d.action === "redirect") location.replace("https://yangdongcheol.github.io/eat-in-korea/");
else {
  document.documentElement.lang = d.lang;
  document.getElementById("msg").textContent = TEXT[d.lang][0];
  document.getElementById("link").textContent = TEXT[d.lang][1];
  document.getElementById("notice").hidden = false;
}
</script>
</body>
</html>
